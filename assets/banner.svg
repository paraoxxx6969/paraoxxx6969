<svg width="1200" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <text
    x="60"
    y="90"
    font-size="28"
    fill="#00ff88"
    font-family="monospace"
    filter="url(#glow)">
&gt; booting developer profile...
  </text>

  <text
    x="60"
    y="150"
    font-size="46"
    fill="white"
    font-family="Arial"
    font-weight="bold">
ARYAN RAWAT
  </text>

  <text
    x="60"
    y="195"
    font-size="22"
    fill="#00ff88"
    font-family="monospace">
Full Stack Developer
  </text>

  <text
    x="60"
    y="225"
    font-size="18"
    fill="#8b949e"
    font-family="monospace">
React • Three.js • Node.js • AI
  </text>

  <rect
    x="760"
    y="40"
    width="360"
    height="240"
    rx="12"
    fill="#0d1117"
    stroke="#00ff88"
    stroke-width="2"/>

  <text
    x="790"
    y="90"
    fill="#00ff88"
    font-size="18"
    font-family="monospace">
Status : ONLINE
  </text>

  <text
    x="790"
    y="125"
    fill="white"
    font-size="18"
    font-family="monospace">
Location : Mumbai 🇮🇳
  </text>

  <text
    x="790"
    y="160"
    fill="white"
    font-size="18"
    font-family="monospace">
Focus : Building Amazing Products
  </text>

  <text
    x="790"
    y="220"
    fill="#00ff88"
    font-size="18"
    font-family="monospace">
$ npm run build
  </text>

  <rect x="1000" y="206" width="12" height="20" fill="#00ff88">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>
</svg>